# GoReleaser builds the prebuilt binaries attached to each GitHub release.
# Cut a release by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# The .github/workflows/release.yml workflow runs `goreleaser release` on the tag.
version: 2

project_name: aish

before:
  hooks:
    - go mod tidy

builds:
  - id: aish
    main: ./cmd/aish
    binary: aish
    env:
      - CGO_ENABLED=0 # pure Go, so the binaries cross-compile and are static
    goos:
      - linux # macOS/Windows unsupported (Linux-only PTY/termios + /proc)
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

  # aishwnd is the Linux/WSL half of the aishwin feature (see cmd/aishwnd) —
  # built the same way as aish itself, since it's equally pure Go.
  - id: aishwnd
    main: ./cmd/aishwnd
    binary: aishwnd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

  # aishwin is the Windows half (see cmd/aishwin): raw syscall-based Win32
  # GUI code, no cgo, so it cross-compiles from this Linux CI runner exactly
  # like the other two.
  #
  # -H=windowsgui is required, not cosmetic: without it the release binary is
  # linked for the console subsystem and every shell that launches aishwin is
  # held until the window closes. The subsystem has no source-level equivalent
  # in Go, so it must be repeated in each build command (Makefile, install.ps1,
  # here).
  - id: aishwin
    main: ./cmd/aishwin
    binary: aishwin
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    flags:
      - -trimpath
    ldflags:
      - -s -w -H=windowsgui -X main.version={{ .Version }}

archives:
  - id: aish
    ids: [aish]
    # Version-less names so releases/latest/download/aish_linux_amd64.tar.gz is a
    # stable URL the README and install scripts can hard-code.
    name_template: "aish_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE

  - id: aishwnd
    ids: [aishwnd]
    name_template: "aishwnd_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE

  - id: aishwin
    ids: [aishwin]
    name_template: "aishwin_{{ .Os }}_{{ .Arch }}"
    formats: [zip] # Windows-idiomatic, and archives/formats can't mix per id
    files:
      - README.md
      - LICENSE
      # side-by-side manifest: Windows only honors this if it sits next to
      # aishwin.exe under the exact name "aishwin.exe.manifest" (no embedded
      # resource is built into the binary) — see cmd/aishwin/gui_settings.go.
      - src: aishwin.exe.manifest
        dst: aishwin.exe.manifest

checksum:
  name_template: "checksums.txt"

release:
  draft: false
  prerelease: auto # vX.Y.Z-rc* → prerelease; plain vX.Y.Z → "latest"

changelog:
  use: github
  sort: asc
