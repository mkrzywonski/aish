name: test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install search backends
        run: sudo apt-get update && sudo apt-get install -y ripgrep busybox
      - name: Require backend coverage
        run: command -v rg && command -v grep && command -v busybox
      - run: go test ./...
      - run: go vet ./...
      - name: Cross-build Windows GUI
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -ldflags '-H=windowsgui' -o '${{ runner.temp }}/aishwin.exe' ./cmd/aishwin
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./cmd/aishwin ./internal/aishwinwire
